# 依赖和版本来源记录。权威构建入口是
# ../scripts/build-staging-runner.sh；该脚本应用完整 Wine Staging
# 补丁集并使用 Wine 新 WoW64 模式生成用户级 Flatpak runner：Unix
# 侧只依赖 x86-64，Windows PE 侧同时包含 i386/x86-64。
id: io.github.huzhiyu.AlipayDevToolsWine
default-branch: staging-25.08
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
command: wine
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # 仅放行新 WoW64 执行 Win32 PE 所需的 seccomp 系统调用；不挂载
  # org.freedesktop.Platform.Compat.i386，Unix 侧仍为纯 x86-64。
  - --allow=multiarch
  - --filesystem=xdg-download/AlipayDevTools:create
  - --env=WINEPREFIX=/var/data/wine-alipay-devtools
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64
modules:
  - name: wine-staging-new-wow64
    config-opts:
      - --enable-archs=i386,x86_64
      - --disable-winemenubuilder
      - --disable-tests
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
        sha256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
      - type: archive
        url: https://gitlab.winehq.org/wine/wine-staging/-/archive/v11.0/wine-staging-v11.0.tar.gz
        sha256: 226dc2fc10ec4eb64d7dbc7c66fcf262ea52aa0e3362b9d61b715d85897cbeb3
